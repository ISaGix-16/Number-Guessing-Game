<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/" aria-current="page">Home</a>
    </nav>

    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try and guess a random number between 1 to 100</p>
        <p>You have 10 attempts to guess the right number.</p>
    
        <br>

        <form class="form">
            <label for="guessField" id="guess">
                Guess a Number
            </label>
            <input
                type="text"
                id="guessField"
                placeholder="Enter 1 - 100"
            >
            <input 
                type="submit" 
                id="subt" 
                value="Submit Guess" 
                class="guessSubmit"
            >
        </form>

        <div class="resultParas">
            <p>Previous Guesses: <span class="guesses"></span></p>
            <p>Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="guessTheNumber.js"></script>
</body>
</html>

<!--
    min="1" and max="100" can be used with input type="number"
    to restrict the allowed range.

    I'm using type="text" because I'm handling
    input validation using JavaScript.
    
    For a real-world application, type="number" would
    generally be more appropriate for this use case.
-->
